[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wildfire-model"
version = "0.1.0"
description = "Verified one-dimensional foundation for a deterministic ADR wildfire model"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Wildfire Model contributors" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wildfire_model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"codex_tests/*" = ["N806"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wildfire_model"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true
